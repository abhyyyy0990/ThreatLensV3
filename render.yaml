services:
  - type: web
    name: threatlens-v3
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        fromGroup: threatlens-secrets
      - key: GOOGLE_SAFE_BROWSING_KEY
        fromGroup: threatlens-secrets
      - key: PHISHTANK_API_KEY
        fromGroup: threatlens-secrets
      - key: JWT_SECRET
        fromGroup: threatlens-secrets
